name = "habitracker-push"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Runs every 15 minutes; the code fires each user's nudge at their local time.
[triggers]
crons = ["*/15 * * * *"]

# Public VAPID key + contact and the public Google OAuth client id.
# SECRETS (not here): set once with wrangler secret put —
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put GOOGLE_CLIENT_SECRET   # from Google Cloud OAuth client
[vars]
VAPID_PUBLIC_KEY = "BGvQ67JhVVIln29VSJUglqwdrXPZN3dNpQ53bCJ4RNwh2-b40hcAnh4NSO3rl7Ew8x22tt0h3EXmX7siBbLWLTE"
VAPID_SUBJECT = "mailto:sowmyanarayanan.ss@zohocorp.com"
GOOGLE_CLIENT_ID = "640513632654-ki88su8e91lr5o6bunjg6801s15k07f7.apps.googleusercontent.com"

# Storage for subscriptions. Create it once, then paste the id below:
#   npx wrangler kv namespace create SUBSCRIPTIONS
[[kv_namespaces]]
binding = "SUBSCRIPTIONS"
id = "f5bd09b3fef4421cb382064ae82ee32a"

# Storage for persistent auth sessions (session id -> refresh token).
# Create it once, then paste the id below:
#   npx wrangler kv namespace create SESSIONS
[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_SESSIONS_KV_ID"
